name: Deploy

# Continuous deployment to AWS on every push to master:
#   verify -> cdk deploy (web + worker images, full stack) -> run DB migrations
#
# One-time setup (see README "Continuous deployment"):
#   1. npx cdk deploy GithubOidc -c githubRepo=<owner/repo>   (in infra/)
#   2. Repo secret  AWS_DEPLOY_ROLE_ARN  = the emitted role ARN
#   3. Repo secret  CLERK_PUBLISHABLE_KEY = pk_live_... (inlined at build time)
#   4. Optional repo variables: AWS_REGION (default us-east-1),
#      DIGEST_FROM_EMAIL (verified SES sender for weekly digests),
#      ENABLE_MCP=true (also deploy the remote MCP server; requires
#      MCP_CERTIFICATE_ARN and MCP_DOMAIN_NAME, optional MCP_POINTUP_URL)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run all release checks without deploying or migrating AWS
        type: boolean
        required: false
        default: false

permissions:
  id-token: write # OIDC federation - no long-lived AWS keys
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check-config:
    name: Check deploy configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Verification-only dispatch; AWS deployment and migrations are disabled."
          elif [ -n "$ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN secret not set - skipping deployment."
          fi

  # Use the same complete gate as pull requests: includes actual PostgreSQL,
  # Docker/pooler smoke, all bundles, plugin contracts and infrastructure.
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [check-config, verify]
    if: needs.check-config.outputs.configured == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: CDK deploy
        working-directory: infra
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          ENABLE_MCP: ${{ vars.ENABLE_MCP }}
          ENABLE_AGENTS: ${{ vars.ENABLE_AGENTS }}
          ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
          ASSISTANT_TRACING_ENABLED: ${{ vars.ASSISTANT_TRACING_ENABLED }}
          ENABLE_CHATGPT_LINKING: ${{ vars.ENABLE_CHATGPT_LINKING }}
          CHATGPT_CLIENT_ID: ${{ vars.CHATGPT_CLIENT_ID }}
          CHATGPT_REDIRECT_URI: ${{ vars.CHATGPT_REDIRECT_URI }}
          CHATGPT_CLIENT_AUTH_METHOD: ${{ vars.CHATGPT_CLIENT_AUTH_METHOD }}
          MCP_CERTIFICATE_ARN: ${{ vars.MCP_CERTIFICATE_ARN }}
          MCP_DOMAIN_NAME: ${{ vars.MCP_DOMAIN_NAME }}
          MCP_POINTUP_URL: ${{ vars.MCP_POINTUP_URL }}
        run: |
          CTX=()
          if [ "$ENABLE_AGENTS" = "true" ]; then
            if [ -z "$ASSISTANT_MODEL" ]; then
              echo "ENABLE_AGENTS requires an explicit ASSISTANT_MODEL" >&2
              exit 1
            fi
            CTX+=(-c enableAgents=true -c "assistantModel=$ASSISTANT_MODEL")
            if [ "$ASSISTANT_TRACING_ENABLED" = "true" ]; then
              CTX+=(-c assistantTracing=true)
            fi
          fi
          if [ "$ENABLE_CHATGPT_LINKING" = "true" ]; then
            if [ -z "$CHATGPT_CLIENT_ID" ] || [ -z "$CHATGPT_REDIRECT_URI" ] || [ -z "$CHATGPT_CLIENT_AUTH_METHOD" ]; then
              echo "ENABLE_CHATGPT_LINKING requires approved CHATGPT_CLIENT_ID, registered HTTPS CHATGPT_REDIRECT_URI and explicit CHATGPT_CLIENT_AUTH_METHOD" >&2
              exit 1
            fi
            # CDK validates the registered HTTPS callback and authentication method.
            # Confidential client secrets remain in Secrets Manager, outside CI.
            CTX+=(-c enableChatGptLinking=true -c "chatGptClientId=$CHATGPT_CLIENT_ID" -c "chatGptRedirectUri=$CHATGPT_REDIRECT_URI" -c "chatGptClientAuthMethod=$CHATGPT_CLIENT_AUTH_METHOD")
          fi
          if [ "$ENABLE_MCP" = "true" ]; then
            CTX+=(-c enableMcp=true)
            # Bearer tokens must not cross the ALB in cleartext: fail fast without TLS.
            if [ -z "$MCP_CERTIFICATE_ARN" ] || [ -z "$MCP_DOMAIN_NAME" ]; then
              echo "ENABLE_MCP requires MCP_CERTIFICATE_ARN and MCP_DOMAIN_NAME" >&2
              exit 1
            fi
            CTX+=(-c "mcpCertificateArn=$MCP_CERTIFICATE_ARN" -c "mcpDomainName=$MCP_DOMAIN_NAME")
            [ -n "$MCP_POINTUP_URL" ] && CTX+=(-c "mcpPointupUrl=$MCP_POINTUP_URL")
          fi
          npx cdk deploy TemplateApp "${CTX[@]}" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Run database migrations
        working-directory: infra
        run: |
          CLUSTER=$(jq -r '.TemplateApp.ClusterArn' cdk-outputs.json)
          TASK_DEF=$(jq -r '.TemplateApp.MigrationTaskDefinitionArn' cdk-outputs.json)
          SUBNETS=$(jq -r '.TemplateApp.MigrationSubnetIds' cdk-outputs.json)
          SG=$(jq -r '.TemplateApp.MigrationSecurityGroupId' cdk-outputs.json)

          echo "Starting migration task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --started-by "github-actions-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`Migrate`] | [0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]
