name: CI

# Pull-request checks. Pushes to master run the same verification inside the
# Deploy workflow (.github/workflows/deploy.yml) before shipping to AWS.
on:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations (incl. RLS)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/app

      - name: Unit + Postgres integration tests
        run: npm run test

      - name: Generate ChatGPT Action spec
        run: npx tsx plugins/chatgpt/build.ts

      - name: Build web app
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          # Placeholder key with a valid format; the real key is provided at
          # deploy time (see infra/lib/app-stack.ts).
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk

      - name: Build worker bundle
        run: npm run build --workspace @pointup/worker

      - name: Build bot bundle
        run: npm run build --workspace @pointup/bot

      - name: Build MCP server bundle
        run: npm run build --workspace @pointup/mcp

      - name: Build extension
        run: npm run build --workspace @pointup/extension

  infra:
    name: Typecheck & synth infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Synth
        run: npx cdk synth --quiet
